.search-results {
  margin-top: 0;
  display: grid;
  min-block-size: 100vh;
}
.search-results mark {
  padding: 0 0.12em;
  border-radius: 3px;
  color: var(--ink);
  background: rgba(var(--accent-rgb), 0.28);
}

.search-results .post-card:first-child {
  min-height: 230px;
  grid-column: auto;
  justify-content: flex-start;
  padding: 25px 26px;
  background-color: rgba(var(--glass-surface-rgb), var(--glass-soft-opacity));
  background-image: linear-gradient(145deg, rgba(255, 255, 255, 0.045), transparent 28%, rgba(var(--accent-rgb), 0.018));
}

.search-results .post-card:first-child::before { display: none; }
.search-results .post-card:first-child h3 { max-width: none; font-size: 20px; }
.search-results .post-card:first-child .post-meta,
.search-results .post-card:first-child .post-summary { max-width: none; }
.search-state {
  align-self: start;
  justify-self: stretch;
  display: grid;
  justify-items: start;
  gap: 16px;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--muted);
  background: var(--surface-soft);
}
.search-state p { margin: 0; }
.search-state-actions {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex-wrap: wrap;
}
.search-retry {
  align-self: start;
  justify-self: start;
  min-inline-size: 44px;
  min-block-size: 44px;
}
/* ================= Footer and reveal ================= */
.site-footer {
  padding: 30px 20px 42px;
  color: var(--muted);
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.025em;
}

.site-footer a {
  min-inline-size: 44px;
  min-block-size: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: inherit;
}
.site-footer a:hover,
.site-footer a:focus-visible { color: var(--accent-strong); }

@keyframes pageCurtainReveal {
  from { opacity: 1; }
  to { opacity: 0; }
}
@media (max-width: 900px) {
  .site-header { padding-inline: 14px; }
  .nav-shell { gap: 10px; }
  .brand small { display: none; }
  .container { padding-inline: 16px; }
}
@media (max-width: 900px) {
  .post-list { grid-template-columns: 1fr; }
  .post-card { min-height: auto; }
  .post-card:first-child { grid-column: auto; min-height: 280px; }
}
@media (max-width: 680px) {
  html { scroll-padding-top: 132px; }
  .site-header { padding: 8px 8px 0; }
  .nav-shell {
    min-height: auto;
    padding: 8px;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    border-radius: 15px;
  }
  .brand {
    min-width: 0;
    min-inline-size: 44px;
    min-block-size: 44px;
    padding: 4px;
    flex: 1 0 100%;
  }
  .brand .logo { width: 36px; height: 36px; }
  .brand-copy { display: none; }
  .nav-actions { width: 100%; min-width: 0; flex: 1 1 100%; gap: 5px; }
  .site-nav {
    width: auto;
    max-width: none;
    min-width: 0;
    flex: 1 1 auto;
    justify-content: space-between;
    overflow-x: visible;
  }
  .site-nav a { padding: 8px; font-size: 12px; }

  .glass-surface,
    .post-card,
    .board,
    .article,
    .archive-day {
    box-shadow: none;
    backdrop-filter: blur(8px) saturate(115%);
    -webkit-backdrop-filter: blur(8px) saturate(115%);
  }

  .brand .logo { box-shadow: none; }
}
@media (max-width: 680px) {
  .container { padding: 22px 12px 56px; }
}
@media (max-width: 680px) {
  .page-intro { padding: 24px 20px; border-radius: 17px; }
  .page-title { font-size: 27px; }
  .search-hero { padding: 32px 24px 36px; border-radius: 20px; }
  .search-hero .page-title { font-size: clamp(52px, 14vw, 58px); }
  .search-hero .page-desc { margin-top: 16px; font-size: 16px; }
}
@media (max-width: 680px) {
  .board,
  .post-card,
  .archive-day { padding: 20px; border-radius: 17px; }
  .tag-cloud { padding: 16px; }
  .search-panel { padding: 20px; }
  .search-controls { flex-wrap: wrap; }
  .search-controls input { flex-basis: 100%; }
  .search-controls .button { flex: 1 1 120px; }
}
@media (max-width: 680px) {
  .post-card:first-child { min-height: auto; padding: 24px 20px; }
  .post-card:first-child::before { inset: 0 0 0 38%; opacity: 0.24; }
  .post-card:first-child .post-meta,
  .post-card:first-child .post-summary,
  .post-card:first-child .stats-bar { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  body::after { animation: none; opacity: 0; }
  .hero-image { animation: none !important; transform: none !important; }
  .hero-media,
  .hero-panel { transform: none !important; transition: none !important; will-change: auto; }
  [data-kinetic-heading] { animation: none !important; }
  .signal-field { display: none; }
  .reveal { opacity: 1; transform: none; }
  .glass-surface::before { display: none; }
  .board:hover,
  .post-card:hover,
  .button:hover,
  .tag-cloud a:hover,
  .theme-toggle:hover { transform: none; }
}
