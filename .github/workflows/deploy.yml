name: Build & Deploy to GitHub Pages

on:
  # 1. 每次推送到 main 分支自动部署（发新文章时）
  push:
    branches: [main]
  # 2. 每天 08:00（北京时间）自动抓取「每日精选」并发布
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 北京时间 08:00
  # 3. 允许在 Actions 页面手动触发
  workflow_dispatch:

# GitHub Pages 部署所需权限
# contents: write —— 允许把每日精选数据 commit 回 main 分支
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Install dependencies before running the reproducible content and image builds.
      - name: Install dependencies
        run: npm ci

      - name: Build site assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit and integration tests
        run: npm test

      - name: Run accessibility gate
        run: npm run test:a11y

      - name: Run Lighthouse gate
        run: npm run test:lighthouse

      - name: Fetch daily feeds
        run: node scripts/fetch-feeds.js
        continue-on-error: true   # 抓取失败不阻断部署，保留上次数据

      # 把抓取更新的每日精选数据 commit 回 main 分支，保证仓库数据文件与
      # Pages 部署一致。即使某天部署失败，下次仍能从仓库恢复历史数据，
      # 而非依赖 Actions runner 的临时工作目录。
      # commit 信息含 [skip ci] 避免本次 push 再次触发 workflow（防无限循环）。
      - name: Commit updated feed data
        continue-on-error: true   # commit/push 失败不阻断 Pages 部署（最佳努力回写仓库）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/feed-data.js public/assets/js/feed-archive.js
          if git diff --cached --quiet; then
            echo "No feed data changes to commit."
          else
            git commit -m "chore(feed): auto-update daily feeds [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        # 只发布明确的静态目录，不暴露源码、测试或配置
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Pages 未启用时自动启用（需仓库为 Public 或具备资格）
        with:
          enablement: true
